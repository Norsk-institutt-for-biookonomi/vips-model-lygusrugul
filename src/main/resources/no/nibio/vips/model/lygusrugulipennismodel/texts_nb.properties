statusInterpretation=<h3>Forklaring til grafen</h3>\n<p>Angrep forutsetter etablert plantebestand (utplantet, eller s&aring;dde kulturer etter at varige blad er utviklet) og at tegene er til stede. Det er ikke alltid behov for &aring; utf&oslash;re bekjempelse. En eventuell kjemisk bekjempelse m&aring; vurderes i hvert enkelt tilfelle. Er du i tvil om tegene utgj&oslash;r en fare for din &aring;ker, kan du kontakte din lokale r&aring;dgiver.</p>\n<p>Den grafiske presentasjonen viser utviklingen av maksimumstemperaturen relatert til terskelverdiene (15 &deg;C og 10 &deg;C) og antall dager &ge; 15 &deg;C som ligger til grunn for de gr&oslash;nne, gule og r&oslash;de varslene. Grafen viser rette horisontale linjer for terskelverdiene; &laquo;&Oslash;vre terskelverdi for temperatur&raquo; (= 15 &deg;C) og &laquo;Nedre terskelverdi for temperatur&raquo; (= 10 &deg;C). Linjen &laquo;Dager over terskeltemperaturen&raquo; viser en akkumulering av antall dager over &ge; 15 &deg;C. Linjen &laquo;Maksimumstemperatur, d&oslash;gnverdi&raquo; viser d&oslash;gnverdien for maksimumstemperatur det enkelte d&oslash;gn. Bakgrunnsfargen i grafen angir n&aring;r det er gr&oslash;nt, gult og r&oslash;dt varsel.</p>\n<h3>Forklaring til tabellen</h3>\n<p>N&aring;r varselstatus er gr&oslash;nn er det ikke fare for angrep</p>\n<p>N&aring;r varselstatus er gul er det behov for &aring; v&aelig;re p&aring; vakt. Gult varsel angir at tegene er kommet fram fra overvintringsstedene og er klare til innflyging, eller at de er lite aktive i feltet pga. lave temperaturer (etter innflyving).</p>\n<p>N&aring;r varselstatus er r&oslash;d er det stor fare for angrep i feltet. R&oslash;dt varsel angir at tegene allerede har hatt betingelser for innflyging i feltene, og forventes &aring; ha stor aktivitet i feltene p&aring; dager med temperaturer &ge; 15 &deg;C.</p>\n<p>Angrep forutsetter etablert plantebestand (utplantet, eller s&aring;dde kulturer etter at varige blad er utviklet).</p>\n<p>Gr&aring; bokser angis etter sluttdato for varslet ved den enkelte stasjon. Sluttdato er satt til 15/6 for stasjoner s&oslash;r for Saltfjellet og 1/7 for stasjoner nord for Saltfjellet. Etter disse datoene vil det normalt v&aelig;re liten fare for angrep av h&aring;ret engtege i gr&oslash;nnsakskulturer.</p>
description=<p>{{filename="/images/lygusr.jpg" description="Foto: E. Fl&oslash;istad"}}</p>\n<h2>Modellbeskrivelse</h2>\n<p>Varslingsmodellen &laquo;H&aring;ret engtege &ndash;innflyving i gr&oslash;nnsakkulturer&raquo; er en egenutviklet modell basert p&aring; temperaturkrav til aktivitet (ikke publisert). Den ble utviklet av Tor J. Johansen i 2004-2005 etter flere &aring;rs studier i nordnorske gulrotfelt av sammenheng mellom maksimumstemperaturer og opptreden i &aring;keren, samt unders&oslash;kelser av flyveaktivitet i S&oslash;r-Norge i perioden 2005-2007. I 2008 ble varslingsmodellen implementert i VIPS og tatt i bruk for f&oslash;rste gang.</p>\n<p>Varslet er r&aring;dgivende og angir n&aring;r det er stor risiko for innflyging i &aring;krene og fare eller ikke fare for angrep p&aring; plantene ut fra r&aring;dende temperaturforhold. Det m&aring; tas hensyn til lokale temperaturer dersom m&aring;lestasjonen er langt unna. Reelt angrep avhenger ogs&aring; av egenskaper hos plantebestandet og utviklingsstadiet til plantene. I tillegg vil st&oslash;rrelsen p&aring; tegepopulasjonen (angrepstrykket) variere fra &aring;r til &aring;r, blant annet ut fra varierende overvintringsforhold.</p>\n<p>Varslingsmodellen settes i gang 1. april, med temperaturdata tilbake i tid. Modellen bruker maksimumstemperatur i d&oslash;gnet (TXD) ved beregning av risiko for angrep. Det brukes b&aring;de historiske data og prognoser (2 d&oslash;gnsprognose, dvs. prognose for dagen i dag og 1 dag frem).</p>\n<h2>Tolking av varsel</h2>\n<p>Gr&oslash;nne bokser betyr at det ikke er fare for angrep. Gr&oslash;nne bokser presenteres i perioden f&oslash;r innflygingsbetingelsene er oppfylt (makstemperatur under 15 &deg;C), og dersom temperaturen faller under 10 &deg;C etter at det har v&aelig;rt presentert gule eller r&oslash;de varsler.</p>\n<p>Gule bokser angir behov for &aring; v&aelig;re p&aring; vakt, og betyr at tegene er kommet fram fra overvintringsstedene og er klare til innflyging, eller at de er lite aktive i feltet pga. lave temperaturer. Gule bokser presenteres f&oslash;rste gang n&aring;r maksimumstemperaturen har n&aring;dd minst 15 &deg;C i tre dager (trenger ikke v&aelig;re sammenhengende). Deretter p&aring; dager med maksimumstemperatur mellom 10 og 15 &deg;C.</p>\n<p>R&oslash;de bokser betyr at det er stor fare for angrep i feltet. Varslet gis f&oslash;rste gang n&aring;r maksimumstemperaturen har v&aelig;rt over eller lik 15 &deg;C i fire dager (trenger ikke v&aelig;re sammenhengende). Varslet fortsetter s&aring; lenge maksimumstemperaturen holder seg p&aring; samme niv&aring;. F&oslash;rste dag med maksimumstemperatur under 15 &deg;C, g&aring;r varslet over til gult igjen. Deretter blir det r&oslash;dt varsel hver dag med temperaturer st&oslash;rre eller lik 15 &deg;C. R&oslash;d boks angir n&aring; at tegene allerede har hatt betingelser for innflyging i feltene, og forventes &aring; ha stor aktivitet i feltene p&aring; dager med temperaturer lik eller st&oslash;rre enn 15 &deg;C.</p>\n<p>Angrep forutsetter etablert plantebestand (utplantet, eller s&aring;dde kulturer etter at varige blad er utviklet)&nbsp;og at tegene er til stede. Det er ikke alltid behov for &aring; utf&oslash;re bekjempelse. En eventuell kjemisk bekjempelse m&aring; vurderes i hvert enkelt tilfelle. Er du i tvil om tegene utgj&oslash;r en fare for din &aring;ker, kan du kontakte din lokale r&aring;dgiver.</p>\n<p>Gr&aring; bokser angis etter sluttdato for varslet ved den enkelte stasjon. Sluttdato er satt til 15/6 for stasjoner s&oslash;r for Saltfjellet og 1/7 for stasjoner nord for Saltfjellet. Etter disse datoene vil det normalt v&aelig;re liten fare for angrep av h&aring;ret engtege i gr&oslash;nnsakskulturer.</p>\n<h2>Varslingssesong &ndash; oppstart og avslutning av varsel</h2>\n<h3>Starttidspunkt</h3>\n<p>Varsel presenteres fra 1/4 med data tilbake i tid</p>\n<h3>Sluttidspunkt</h3>\n<p>Sluttdato er satt til 15/6 for stasjoner s&oslash;r for Saltfjellet og 1/7 for stasjoner nord for Saltfjellet.</p>\n<h2>Utpr&oslash;ving og validering av modellen</h2>\n<h3>Nasjonalt</h3>\n<p>Modellen ble tatt i bruk i VIPS i 2008. Modellen er validert over flere &aring;r (2008-2013) ved &aring; registrere tegeaktivitet med bruk av feromonfeller og/eller kollisjonsfeller. Validering med bruk av temperaturlogger plassert i 2m h&oslash;yde med tak over (simulering av en v&aelig;rstasjon) i felt viser at modellen treffer ganske godt med funn av teger i feller i samme felt. Avstand fra felt til n&aelig;rmeste v&aelig;rstasjon vil p&aring;virke hvor treffsikker modellen er. Jo lenger avstand og jo st&oslash;rre endring av lokalklima i forhold til n&aelig;rmeste v&aelig;rstasjon, jo mer usikker vil varsel v&aelig;re.</p>\n<h3>Internasjonalt</h3>\n<p>Forel&oslash;pig ingen informasjon</p>\n<h2>Referanser</h2>\n<p>Forel&oslash;pig ingen publikasjoner</p>\n<h2>Kontaktpersoner</h2>\n<p><a href="http://www.nibio.no/ansatte/tor_johansen" target="_blank">Tor J. Johansen</a>&nbsp;og <a href="http://www.nibio.no/ansatte/annette_folkedalschjll" target="_blank">Annette F. Schj&oslash;ll</a></p>\n<h2>Lenker til mer informasjon</h2>\n<p>Mer om H&aring;ret engtege finner du i <a href="http://leksikon.nibio.no/vieworganism.php?organismId=1_922&amp;cropGroupId=-1&amp;cropId=-1&amp;pestGroupId=-1&amp;showMacroOrganisms=false" target="_blank">Plantevernleksikonet</a>&nbsp;</p>
